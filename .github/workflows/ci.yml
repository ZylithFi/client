name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@ebb3d1676050bfd0971c36c1e215b5751473994d
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sdk/package-lock.json
      - run: npm ci
      - run: npm ci --prefix sdk
      - run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - run: |
          scripts/wallet_wasm_source_hash.sh --check
          npm test -- --run
          npm run build:app
          node --test scripts/check-bundle-budget.test.mjs
          node scripts/check-bundle-budget.mjs
          npm test --prefix sdk -- --run
          npm run build --prefix sdk
          (cd sdk && npm pack --dry-run)
